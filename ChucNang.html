<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Sách - Giỏ Hàng</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 0; background: #f9f9f9; }
    header { background: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 22px; }
    header button { background: #e67e22; border: none; padding: 8px 15px; border-radius: 6px; color: white; cursor: pointer; font-size: 15px; }
    header button:hover { background: #d35400; }

    main { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
    .book { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 15px; width: 220px; text-align: center; }
    .book h3 { margin: 10px 0 5px; font-size: 18px; color: #333; }
    .book p { margin: 5px 0; color: #666; font-size: 14px; }
    .book button { background: #27ae60; border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    .book button:hover { background: #219150; }

    /* Modal Giỏ hàng */
    .cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .cart-content { background: white; border-radius: 10px; width: 400px; max-height: 80%; overflow-y: auto; padding: 20px; position: relative; }
    .cart-content h2 { margin-top: 0; }
    .cart-content table { width: 100%; border-collapse: collapse; }
    .cart-content th, .cart-content td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
    .cart-content tfoot td { font-weight: bold; }
    .cart-content button { margin-top: 10px; background: #2980b9; border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    .close-btn { position: absolute; top: 10px; right: 10px; background: #c0392b; border: none; color: white; padding: 4px 8px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Shop Sách</h1>
    <button onclick="toggleCart()">🛒 Giỏ hàng (<span id="cart-count">0</span>)</button>
  </header>
  <main id="book-list"></main>

  <!-- Modal Giỏ hàng -->
  <div class="cart-modal" id="cart-modal">
    <div class="cart-content">
      <button class="close-btn" onclick="toggleCart()">X</button>
      <h2>Giỏ Hàng</h2>
      <table id="cart-table">
        <thead>
          <tr><th>Sách</th><th>SL</th><th>Giá</th><th></th></tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr><td colspan="2">Tổng:</td><td id="cart-total">0₫</td><td></td></tr>
        </tfoot>
      </table>
      <button onclick="checkout()">Thanh toán</button>
      <button onclick="clearCart()" style="background:#c0392b;margin-left:10px;">Xóa giỏ</button>
    </div>
  </div>

  <script>
    const bookList = document.getElementById('book-list');
    const cartCount = document.getElementById('cart-count');
    const cartModal = document.getElementById('cart-modal');
    const cartTableBody = document.querySelector('#cart-table tbody');
    const cartTotal = document.getElementById('cart-total');

    const PRODUCTS = [
      { id: 'b1', name: 'Đắc Nhân Tâm', price: 120000, desc:'Bìa mềm, 288 trang', author:'Dale Carnegie', isbn:'978-604-969' },
      { id: 'b2', name: 'Tuổi Trẻ Đáng Giá Bao Nhiêu', price: 98000, desc:'Bìa mềm, 200 trang', author:'Rosie Nguyễn', isbn:'978-604-970' },
      { id: 'b3', name: 'Nhà Giả Kim', price: 90000, desc:'Bìa mềm, 167 trang', author:'Paulo Coelho', isbn:'978-604-971' },
      { id: 'b4', name: 'Sapiens', price: 150000, desc:'Bìa mềm, 464 trang', author:'Yuval Noah Harari', isbn:'978-604-972' },
      { id: 'b5', name: 'Bí Quyết Thành Công', price: 85000, desc:'Bìa mềm, 180 trang', author:'Napoleon Hill', isbn:'978-604-973' }
    ];

    let cart = JSON.parse(localStorage.getItem('cart') || '[]');

    function currency(v){return v.toLocaleString('vi-VN',{style:'currency',currency:'VND'})}

    function saveCart(){ localStorage.setItem('cart', JSON.stringify(cart)); }

    function renderBooks(){
      bookList.innerHTML = PRODUCTS.map(b=>`
        <div class='book'>
          <h3>${b.name}</h3>
          <p><b>Tác giả:</b> ${b.author}</p>
          <p>${b.desc}</p>
          <p><b>Giá:</b> ${currency(b.price)}</p>
          <button onclick="addToCart('${b.id}')">Thêm vào giỏ</button>
        </div>
      `).join('');
    }

    function addToCart(id){
      const item = cart.find(x=>x.id===id);
      if(item) item.qty++;
      else cart.push({id, qty:1});
      saveCart(); updateCartDisplay();
      alert('Đã thêm sách vào giỏ!');
    }

    function removeFromCart(id){
      cart = cart.filter(x=>x.id!==id);
      saveCart(); updateCartDisplay();
    }

    function updateCartDisplay(){
      cartCount.textContent = cart.reduce((t,x)=>t+x.qty,0);
      let total = 0;
      cartTableBody.innerHTML = cart.map(c=>{
        const b = PRODUCTS.find(p=>p.id===c.id);
        const subtotal = b.price * c.qty; total += subtotal;
        return `<tr><td>${b.name}</td><td><input type='number' min='1' value='${c.qty}' onchange='changeQty("${c.id}",this.value)' style='width:50px'></td><td>${currency(subtotal)}</td><td><button onclick='removeFromCart("${c.id}")'>X</button></td></tr>`;
      }).join('');
      cartTotal.textContent = currency(total);
    }

    function changeQty(id, qty){
      const item = cart.find(x=>x.id===id);
      if(item){ item.qty = parseInt(qty)||1; }
      saveCart(); updateCartDisplay();
    }

    function checkout(){
      if(cart.length===0){ alert('Giỏ hàng trống!'); return; }
      alert('Thanh toán thành công! (demo)');
      clearCart();
    }

    function clearCart(){ cart=[]; saveCart(); updateCartDisplay(); }

    function toggleCart(){
      const showing = cartModal.style.display==='flex';
      cartModal.style.display = showing ? 'none' : 'flex';
      if(!showing) updateCartDisplay();
    }

    renderBooks();
    updateCartDisplay();
  </script>
</body>
</html>
