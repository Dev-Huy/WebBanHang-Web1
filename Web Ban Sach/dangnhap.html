<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập</title>
    <link rel="stylesheet" href="./css/dangnhap-dangky.css">
    <script type="module" src="./js/dangnhap.js" defer></script>
    <script type="module" src="./js/suathongtin.js"></script>
</head>

<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>Tài khoản</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Về trang chủ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="form-container" id="signin">
            <h2>Đăng nhập</h2>
            <form id="signinForm">
                <div class="form-group">
                    <label for="username">Tên tài khoản:</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu:</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="signin-btn">Đăng nhập</button>
            </form>
            <button type="" id="toEdit-btn1">Quên mật khẩu ?</button>
        </div>
        <div class="form-container" id="editPassword">
            <h2>Đổi mật khẩu</h2>
            <form>
                <div class="form-group">
                    <label for="username-edit">Tài khoản:</label>
                    <input id="username-edit" name="username-edit" autocomplete="current-username">
                </div>
                <div class="form-group">
                    <label for="password-edit">Mật khẩu mới:</label>
                    <input type="password" id="password-edit" name="password-edit" autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="passwordAgain-edit">Nhập lại mật khẩu mới:</label>
                    <input type="password" id="passwordAgain-edit" name="passwordAgain-edit"
                        autocomplete="current-password">
                </div>
                <button type="submit" id="editPassword-btn" class="btn">Đổi mật khẩu</button>
            </form>
        </div>
        <div class="form-container" id="signup">
            <h2>Đăng ký</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Họ tên:</label>
                    <input type="text" id="name" name="name" required autocomplete="">
                </div>
                <div class="form-group">
                    <label for="username-signup">Tên tài khoản: </label>
                    <input type="text" id="username-signup" name="username-signup" required autocomplete="">
                </div>
                <div class="form-group">
                    <label for="email-signup">Email: </label>
                    <input type="text" id="email-signup" name="email-signup" required autocomplete="">
                </div>
                <div class="form-group">
                    <label for="phone-signup">Số điện thoại: </label>
                    <input type="phone" id="phone-signup" name="phone-signup" required autocomplete="">
                </div>
                <div class="form-group">
                    <label for="address-signup">Địa chỉ: </label>
                    <input type="text" id="address-signup" name="address-signup" required autocomplete="">
                </div>
                <div class="form-group">
                    <label for="password-signup">Mật khẩu:</label>
                    <input type="password" id="password-signup" name="password-signup" required autocomplete="">
                </div>
                <div class="form-group">
                    <label for="passwordAgain-signup">Nhập lại mật khẩu:</label>
                    <input type="password" id="passwordAgain-signup" name="passwordAgain-signup" required
                        autocomplete="">
                </div>
                <button type="submit-signup" class="btn" id="signup-btn">Đăng ký</button>
            </form>
        </div>
    </main>
    <!-- Popup sửa thông tin -->
    <div id="editPopup" class="form-container" style="margin-top: 50px;">
        <h2>Sửa thông tin</h2>
        <form id="editForm">
            <div class="form-group">
                <label for="name-edit">Họ tên:</label>
                <input type="text" id="name-edit" name="name-edit" required autocomplete="current-name">
            </div>
            <div class="form-group">
                <label for="email-edit">Email:</label>
                <input type="email" id="email-edit" name="email-edit" required autocomplete="">
            </div>
            <div class="form-group">
                <label for="phone-edit">Số điện thoại:</label>
                <input type="text" id="phone-edit" name="phone-edit" required autocomplete="">
            </div>
            <div class="form-group">
                <label for="address-edit">Địa chỉ:</label>
                <input type="text" id="address-edit" name="address-edit" required autocomplete="">
            </div>
            <div class="form-actions">
                <button type="button" id="closeBtn" class="btn">Đóng</button>
                <button type="submit" id="saveBtn" class="btn">Lưu</button>
            </div>
        </form>
    </div>

</body>

</html>
