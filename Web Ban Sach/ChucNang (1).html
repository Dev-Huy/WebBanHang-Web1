<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Sách - Giỏ Hàng</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 0; background: #f9f9f9; }
    header { background: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 22px; }
    header button { background: #e67e22; border: none; padding: 8px 15px; border-radius: 6px; color: white; cursor: pointer; font-size: 15px; }
    header button:hover { background: #d35400; }
</head>
<body>
  <header>
    <h1>Shop Sách</h1>
    <button onclick="toggleCart()">🛒 Giỏ hàng (<span id="cart-count">0</span>)</button>
  </header>
  <main id="book-list"></main>

  <!-- Modal Giỏ hàng -->

  
</body>
</html>
