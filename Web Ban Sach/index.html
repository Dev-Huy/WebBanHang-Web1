<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Web Ban Sach</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/phan2.css">
    <link rel="stylesheet" href="./css/style2.css">
    <link rel="stylesheet" href="./css/giohang.css">
    <script type="module" src="./js/script.js" defer></script>
    <script type="module" src="./js/script2.js" defer></script>

    <!-- <link rel="stylesheet" href="./css/style3.css"> -->
    <script src="https://kit.fontawesome.com/078463c473.js" crossorigin="anonymous"></script>
    <script type="module" src="./js/loadData.js" defer></script>
    <script type="module" src="./js/dangnhap.js" defer></script>
    <script type="module" src="./js/giohang.js" defer></script>
    <!-- <script type="module" src="./js/timkiem.js" defer></script> -->
    <script type="module" src="./js/render.js" defer></script>
    <script type="module" src="./js/suathongtin.js"></script>

</head>

<body>
    <!-- <button id="scroll_top">Lên trên</button> -->

    <div id="header_subnav">
        <div id="logo">
            <i class="fa-solid fa-book"></i>
        </div>
        <div id="menu">
            <button id="menu_btn"><i class="fa-solid fa-bars"></i></button>
            <ul id="sach_truyen">
                <li><a href="#" id="tamlyhoc">Tâm Lý Học</a></li>
                <li><a href="#" id="vanhoc">Văn Học</a></li>
                <li><a href="#" id="sachgiaokhoa">Sách Giáo Khoa</a></li>
                <li><a href="#" id="khoahoccongnghe">Khoa Học - Công Nghệ</a></li>
                <li><a href="#" id="kinhte">Kinh Tế</a></li>
                <li><a href="#" id="truyentranh">Truyện Tranh</a></li>
            </ul>
        </div>
        <div id="search_form">
            <input type="search" id="search" placeholder="Tìm kiếm..." />
            <button id="filter-btn"><i class="fa-solid fa-filter"></i></button>
            <button id="submit_btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div id="filter-form">
            <div>
                <label>Giá sản phẩm</label>
                <select title="Lọc giá sản phẩm">
                    <option value="Chọn" selected> Chọn </option>
                    <option value="Thấp đến cao">Thấp đến cao</option>
                    <option value="Cao đến thấp">Cao đến thấp</option>
                </select>
            </div>
            <div>
                <label>Khoảng giá:</label><br>
                <label>Từ: </label>
                <input type="number" id="minRange" min="0" max="1000000" step="50000">
                <lable>đến: </lable>
                <input type="number" id="maxRange" min="0" max="1000000" step="50000">
            </div>
        </div>
        <div id="shop">
            <button id="shopBtn"><i class="fa-solid fa-cart-shopping"></i></button>
            <div id="shop_form">
                <div class="cart-modal" id="cart-modal">
                    <div class="cart-content">
                        <button class="close-btn">X</button>
                        <h2>Giỏ Hàng</h2>
                        <table id="cart-table">
                            <thead>
                                <tr>
                                    <th>Mã SP</th>
                                    <th>Sách</th>
                                    <th>SL</th>
                                    <th>Ảnh</th>
                                    <th>Giá</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="book-list"></tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="2">Tổng:</td>
                                    <td id="cart-total">₫</td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                        <div class="cart-actions">
                            <button class="clear" onclick="clearCart()">Xóa giỏ hàng</button>
                            <button class="checkout" onclick="checkout()">Thanh toán</button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        <div id="header_nav">
            <ul>
                <li><a role="button" href="dangnhap.html?action=signup">Đăng ký</a></li>
                <li><a role="button" href="dangnhap.html?action=signin">Đăng nhập</a></li>
            </ul>
            <div id="user-info">
                <table>
                    <tr>
                        <th>Họ tên: </th>
                        <td id="nameinfo"></td>
                    </tr>
                    <tr>
                        <th>Email: </th>
                        <td id="emailinfo"></td>
                    </tr>
                    <tr>
                        <th>Số điện thoại: </th>
                        <td id="phoneinfo"></td>
                    </tr>
                    <tr>
                        <th>Địa chỉ</th>
                        <td id="addressinfo"></td>
                    </tr>
                </table>
                <button id="logout-btn">Đăng xuất</button>
                <button id="edit-btn">Chỉnh sửa thông tin</button>
                <button id="toEdit-btn2">Đổi mật khẩu</button>
                <button id="">Xem lịch sử mua hàng</button>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="slidecontainer">
            <div class="slides">
                <img src="img/slider1.jpg" class="active">
                <img src="img/slider2.jpg">
                <img src="img/slider3.jpg">
            </div>
            <div class="buttons">
                <span class="next">&#10095;</span>
                <span class="prev">&#10094;</span>
            </div>
            <div class="dotsContainer">
                <div class="dot active" attr='0' onclick="switchImage(this)"></div>
                <div class="dot" attr='1' onclick="switchImage(this)"></div>
                <div class="dot" attr='2' onclick="switchImage(this)"></div>
            </div>
        </div>
    </div>
    <div id="main-content">
    </div>
    <div id="overlay" class="hidden"></div>

    <div id="popup" class="hidden">
        <span id="close-btn" class="close-btn" aria-label="Đóng">&times;</span>
        <div class="popup-content">
            <div class="popup-left">
                <img id="popup-img" src="" alt="">
            </div>
            <div class="popup-right">
                <h2 id="popup-title"></h2>
                <p id="popup-author"></p>
                <p id="popup-puplicYear"></p>
                <p id="popup-puplisher"></p>
                <p id="popup-category"></p>
                <p id="popup-desc"></p>
                <p id="popup-price"></p>
                <div class="popup-buttons">
                    <button id="add-to-cart" >Thêm vào giỏ</button>
                    <button id="buy-now">Mua ngay</button>
                </div>
            </div>
        </div>
    </div>
    <div class="copyright">
        &copy; 2025 We-BookStore. Tất cả các quyền được bảo lưu.
    </div>
    <div id="overlayer"></div>
    <script src="js/loadData.js"></script>
</body>

</html>
